allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
  "@merqo/ui": true

# Security: force-patch transitive advisories. Each entry is scoped to the
# vulnerable range, so it self-clears once a dep ships the patched version.
#   postcss          GHSA-qx2v-qp2m-jg93 + GHSA-hj4v-p6cw-vh6m (via next>postcss; path traversal in map auto-loading)
#   undici           GHSA-*-7.28          (dev: via jsdom<-vitest)
#   vite             GHSA-fx2h/v6wh       (dev: via vitest; 6.4.3 is the first patch)
#   sharp            GHSA-f88m-g3jw-g9cj  (via next>sharp; libvips CVE-2026-33327/33328/35590/35591)
#   fast-uri         GHSA-gcx4-mw62-g8wm + GHSA-r889-9v3x-p9cx (dev: via eslint/ajv; host confusion via IDN/backslash)
#   js-yaml          GHSA-mh29-5h37-fv8m  (dev: via stryker; YAML merge-key quadratic CPU DoS)
#   brace-expansion  GHSA-v6h2-p8h4-qcjw  (dev: via eslint/vitest/stryker's minimatch; 3 vulnerable major lines)
overrides:
  postcss@<8.5.18: ">=8.5.18"
  undici@<7.28.0: ">=7.28.0 <8"
  vite@<=6.4.2: ">=6.4.3 <7"
  qs@<6.15.2: ">=6.15.2"
  sharp@<0.35.0: ">=0.35.0"
  fast-uri@<3.1.4: ">=3.1.4"
  nanoid@<3.3.17: ">=3.3.17"
  js-yaml@<4.3.0: ">=4.3.0"
  brace-expansion@<1.1.16: ">=1.1.16 <2"
  brace-expansion@>=2.0.0 <2.1.2: ">=2.1.2 <3"
  brace-expansion@>=3.0.0 <5.0.7: ">=5.0.7"
